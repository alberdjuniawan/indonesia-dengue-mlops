[project]
name = "indonesia-dengue-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cdsapi>=0.7.7",
    "easyocr>=1.7.2",
    "geopandas>=1.1.4",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "httpx>=0.28.1",
    "opencv-python>=5.0.0.93",
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "paddlex>=3.7.2",
    "pandas>=3.0.5",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.17.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "shapely>=2.1.2",
    "torch>=2.14.0",
    "xarray>=2026.7.0",
]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "pre-commit>=4.3.0",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"src/dengue_mlops/ingestion/skdr/ocr.py" = ["BLE001"]
"scripts/build_dengue_dataset.py" = ["BLE001"]
"scripts/ingest_data.py" = ["BLE001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dengue_mlops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
