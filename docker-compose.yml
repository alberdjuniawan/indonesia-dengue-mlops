services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: indonesia-dengue-mlops/api:latest
    container_name: dengue-ml-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - WORKERS=4
      - ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: dengue-ml-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.4.0
    container_name: dengue-ml-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus

  mlflow:
    image: python:3.12-slim
    container_name: dengue-ml-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./models:/mlflow/models
    command: >
      bash -c "pip install --no-cache-dir mlflow &&
      mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/models/mlflow.db --default-artifact-root /mlflow/models/artifacts"
